apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

// Load release signing credentials from keystore.properties (gitignored - local only).
// On F-Droid build servers this file is absent, so the release variant stays unsigned.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Bundle compression is controlled via gradle.properties: android.enableBundleCompression
    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: true).toBoolean()

    // Use Expo CLI to bundle the app - ensures Metro config works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Copy custom sound files from assets/sounds to res/raw during build.
// Uses tasks.register() (Gradle 7+ lazy API) to avoid eager configuration-phase slowdown.
tasks.register('copyCustomSounds', Copy) {
    from "../../assets/sounds"
    into "src/main/res/raw"
    include "cow_moo.mp3", "cow_bell.mp3"
}
tasks.named('preBuild').configure { dependsOn('copyCustomSounds') }

/**
 * R8 minification - controlled via gradle.properties: android.enableMinifyInReleaseBuilds
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.watercow.app'
    defaultConfig {
        applicationId 'com.watercow.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"

        // Restrict resources to English only - drops unused locale string tables.
        resourceConfigurations += ["en"]
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""

        // Hard NDK ABI filter - guarantees arm64-v8a only even for libraries that
        // ignore the reactNativeArchitectures property in gradle.properties.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // ABI splits disabled: we produce a single universal arm64-v8a APK.
    // Per-ABI splits would conflict with ndk.abiFilters above.
    splits {
        abi {
            reset()
            enable false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Conditionally register release signing config when keystore.properties is present.
    // Uses signingConfigs.create() (AGP 8+ safe) instead of an if-block inside signingConfigs{}.
    if (keystoreProps['storeFile']) {
        android.signingConfigs.create("release") {
            storeFile file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sign locally when keystore.properties is present; stays unsigned for F-Droid builds.
            if (keystoreProps['storeFile']) {
                signingConfig android.signingConfigs.getByName("release")
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }

    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
            // Remove duplicate libc++ copies - React Native ships its own authoritative one.
            excludes += [
                "**/*.kotlin_builtins",
                "**/*.kotlin_metadata",
                "**/libc++_shared.so",
            ]
        }
        resources {
            // Drop duplicate META-INF license/notice files added by Apache Commons and similar libs.
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/license.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/notice.txt",
                "META-INF/ASL2.0",
                "META-INF/*.kotlin_module",
            ]
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static packaging options from gradle.properties (comma-delimited lists).
// Example: android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",")
    for (i in 0..<options.size()) options[i] = options[i].trim()
    options -= ""
    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each { android.packagingOptions[prop] += it }
    }
}

dependencies {
    // React Native - version is managed by the React Native Gradle Plugin.
    implementation("com.facebook.react:react-android")

    // Glance AppWidget support
    implementation "androidx.glance:glance:1.0.0"
    implementation "androidx.glance:glance-appwidget:1.0.0"

    // Optional image format support (all disabled in gradle.properties for smaller APK)
    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true"
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true"
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true"

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }
    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    // JS engine: Hermes (enabled via hermesEnabled=true in gradle.properties).
    // JSC fallback version pinned - no + wildcard - to ensure F-Droid reproducibility.
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation('io.github.react-native-community:jsc-android:2026004.0')
    }
}
